<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Write Journal - Dear Diary</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap');

:root {
    --cream: #F8F7F2;
    --white: #FFFFFF;
    --green: #748B78;
    --dark-green: #435B49;
    --light-green: #E8EEE6;
    --text: #343B35;
    --gray: #929A91;
    --border: #E9E9E1;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
}

/* NAVBAR */

.navbar {
    height: 80px;
    padding: 0 9%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--white);
    border-bottom: 1px solid var(--border);
}

.logo {
    font-family: 'Playfair Display', serif;
    font-size: 27px;
    font-weight: 700;
    color: var(--dark-green);
    text-decoration: none;
}

.logo span {
    color: #B9A58D;
}

nav {
    display: flex;
    gap: 35px;
}

nav a {
    text-decoration: none;
    color: var(--gray);
    font-size: 14px;
}

nav a.active,
nav a:hover {
    color: var(--dark-green);
    font-weight: 700;
}

.profile {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--light-green);
    color: var(--dark-green);
    display: grid;
    place-items: center;
    font-weight: 700;
}

/* MAIN CONTAINER */

.container {
    width: 82%;
    max-width: 1150px;
    margin: 55px auto;
}

/* WELCOME */

.welcome {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 25px;
    margin-bottom: 45px;
}

.small-text {
    color: var(--green);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

h1, h2, h3 {
    font-family: 'Playfair Display', serif;
}

.welcome h1,
.editor-heading h1 {
    font-size: clamp(30px, 4vw, 43px);
    color: var(--dark-green);
    margin-bottom: 12px;
}

.subtitle {
    color: var(--gray);
    font-size: 14px;
    line-height: 1.8;
}

/* BUTTON */

.primary-btn {
    background: var(--green);
    color: white;
    border: none;
    padding: 14px 22px;
    border-radius: 8px;
    text-decoration: none;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: inline-block;
    transition: 0.3s;
}

.primary-btn:hover {
    background: var(--dark-green);
    transform: translateY(-2px);
}

/* STATISTICS */

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 55px;
}

.stat-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 25px;
}

.stat-card p {
    color: var(--gray);
    font-size: 13px;
}

.stat-card h2 {
    color: var(--dark-green);
    font-size: 30px;
    margin: 10px 0;
}

.stat-card span {
    color: var(--gray);
    font-size: 12px;
}

/* JOURNAL LIST */

.section-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.section-heading h2 {
    color: var(--dark-green);
    font-size: 27px;
}

.text-link {
    text-decoration: none;
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
}

.entries-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
}

.journal-card {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 23px;
    border-radius: 12px;
    transition: 0.3s;
}

.journal-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(50, 70, 50, 0.06);
}

.card-top {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 20px;
    align-items: center;
}

.mood-pill {
    background: var(--light-green);
    color: var(--dark-green);
    padding: 7px 10px;
    border-radius: 20px;
    font-size: 11px;
}

.entry-date {
    font-size: 11px;
    color: var(--gray);
}

.journal-card h3 {
    font-size: 20px;
    margin-bottom: 12px;
    color: var(--dark-green);
}

.journal-card > p {
    color: var(--gray);
    font-size: 13px;
    line-height: 1.8;
    min-height: 70px;
    overflow-wrap: anywhere;
}

.card-actions {
    display: flex;
    align-items: center;
    gap: 14px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
    padding-top: 15px;
}

.card-actions button,
.card-actions a {
    border: none;
    background: none;
    font-family: inherit;
    text-decoration: none;
    font-size: 12px;
    color: var(--green);
    cursor: pointer;
}

.card-actions .delete-btn {
    color: #B77C75;
}

/* EMPTY STATE */

.empty-state {
    text-align: center;
    padding: 65px 20px;
    background: var(--white);
    border: 1px dashed #D7DED3;
    border-radius: 12px;
}

.empty-icon {
    font-size: 35px;
    color: var(--green);
    margin-bottom: 15px;
}

.empty-state h3 {
    font-size: 23px;
    color: var(--dark-green);
    margin-bottom: 10px;
}

.empty-state p {
    color: var(--gray);
    font-size: 13px;
    margin-bottom: 25px;
    line-height: 1.7;
}

.hidden {
    display: none !important;
}

/* EDITOR PAGE */

.editor-container {
    max-width: 850px;
}

.editor-heading {
    text-align: center;
    margin-bottom: 40px;
}

.back-link {
    display: block;
    text-align: left;
    color: var(--green);
    text-decoration: none;
    font-size: 13px;
    margin-bottom: 45px;
}

.journal-form {
    background: var(--white);
    border: 1px solid var(--border);
    padding: 40px;
    border-radius: 14px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 25px;
    flex: 1;
}

.form-group label {
    color: var(--dark-green);
    font-size: 13px;
    font-weight: 600;
}

.form-group input,
.form-group select,
.form-group textarea {
    width: 100%;
    border: 1px solid var(--border);
    background: #FCFCFA;
    padding: 15px;
    border-radius: 8px;
    outline: none;
    font-family: inherit;
    color: var(--text);
    font-size: 13px;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: var(--green);
}

.form-group textarea {
    resize: vertical;
    line-height: 1.8;
    min-height: 230px;
}

.form-row {
    display: flex;
    gap: 20px;
}

.editor-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    border-top: 1px solid var(--border);
    padding-top: 25px;
}

.editor-footer p {
    color: var(--gray);
    font-size: 12px;
}

.editor-buttons {
    display: flex;
    align-items: center;
    gap: 15px;
}

.cancel-btn {
    color: var(--gray);
    text-decoration: none;
    font-size: 13px;
}

/* MODAL */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(35, 48, 38, 0.55);
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 10;
}

.modal-card {
    background: var(--white);
    padding: 35px;
    border-radius: 14px;
    width: 100%;
    max-width: 600px;
    max-height: 85vh;
    overflow-y: auto;
    position: relative;
}

.modal-close {
    position: absolute;
    top: 15px;
    right: 20px;
    background: none;
    border: none;
    font-size: 28px;
    cursor: pointer;
    color: var(--gray);
}

.modal-card h2 {
    font-size: 28px;
    color: var(--dark-green);
    margin: 20px 0;
    overflow-wrap: anywhere;
}

.modal-date {
    font-size: 12px;
    color: var(--gray);
}

.modal-story {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    line-height: 2;
    color: #626A61;
    font-size: 14px;
    margin: 25px 0;
}

/* FOOTER */

footer {
    text-align: center;
    padding: 25px;
    color: var(--gray);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 60px;
}

/* RESPONSIVE */

@media (max-width: 800px) {

    .container {
        width: 90%;
    }

    .navbar {
        padding: 0 5%;
    }

    .entries-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .welcome {
        align-items: flex-start;
        flex-direction: column;
    }
}

@media (max-width: 550px) {

    .navbar {
        height: 70px;
    }

    nav {
        gap: 15px;
    }

    nav a {
        font-size: 12px;
    }

    .logo {
        font-size: 22px;
    }

    .entries-grid,
    .stats {
        grid-template-columns: 1fr;
    }

    .form-row {
        flex-direction: column;
        gap: 0;
    }

    .journal-form {
        padding: 22px;
    }

    .editor-footer {
        align-items: flex-start;
        flex-direction: column;
    }

    .editor-buttons {
        width: 100%;
        justify-content: space-between;
    }

    .section-heading h2 {
        font-size: 23px;
    }
}
    </style>
</head>
<body data-page="write">

    <header class="navbar">

        <a href="index.html" class="logo">
            dear<span>diary.</span>
        </a>

        <nav>
            <a href="index.html">My Journal</a>
            <a href="write.html" class="active">Write</a>
        </nav>

        <div class="profile">D</div>

    </header>

    <main class="container editor-container">

        <div class="editor-heading">
            <a href="index.html" class="back-link">
                ← Back to Journal
            </a>

            <p class="small-text">A NEW PAGE OF YOUR STORY</p>

            <h1 id="editorTitle">Write Your Story.</h1>

            <p class="subtitle">
                Take your time. This space is yours.
            </p>
        </div>

        <form id="journalForm" class="journal-form">

            <div class="form-group">
                <label for="title">Journal Title</label>

                <input
                    type="text"
                    id="title"
                    placeholder="Give your story a title..."
                    required
                >
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="date">Date</label>

                    <input
                        type="date"
                        id="date"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="mood">How are you feeling?</label>

                    <select id="mood">
                        <option value="😊 Happy">😊 Happy</option>
                        <option value="🥰 Loved">🥰 Loved</option>
                        <option value="😌 Calm">😌 Calm</option>
                        <option value="😔 Sad">😔 Sad</option>
                        <option value="😴 Tired">😴 Tired</option>
                        <option value="🤩 Excited">🤩 Excited</option>
                    </select>
                </div>

            </div>

            <div class="form-group">
                <label for="content">Your Story</label>

                <textarea
                    id="content"
                    rows="12"
                    placeholder="Dear diary, today I want to tell you about..."
                    required
                ></textarea>
            </div>

            <div class="editor-footer">

                <p>♡ Your memories are safe here.</p>

                <div class="editor-buttons">
                    <a href="index.html" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="primary-btn">
                        Save Journal
                    </button>
                </div>

            </div>

        </form>

    </main>

    <footer>
        <p>Made with love ♡ Dear Diary 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
